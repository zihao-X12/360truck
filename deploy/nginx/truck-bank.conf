# 大货车管理平台 —— 宿主机 Nginx 配置（银河麒麟 V10）
#
# 用途：方案 A（推荐）——前端用包内 dist/ 由宿主机 nginx 托管，
#       后端跑在 Docker 容器（host 网络，监听 127.0.0.1:9099），
#       MySQL 与 Redis 用宿主机已装/新装的服务。
#
# 安装：
#   sudo cp deploy/nginx/truck-bank.conf /etc/nginx/conf.d/truck-bank.conf
#   sudo vi /etc/nginx/conf.d/truck-bank.conf     # 改 root 路径与端口
#   sudo nginx -t && sudo systemctl reload nginx
#
# 若宿主机 80 端口被系统自带站点占用，把 listen 改为 8080 并放通对应端口。

server {
    listen 80;
    server_name _;

    # 前端静态文件：改成实际部署路径
    root /opt/truck-bank/dist;
    index index.html index.htm;

    charset utf-8;
    client_max_body_size 100m;      # 与后端 MAX_FILE_SIZE(100MB) 对齐

    access_log /var/log/nginx/truck-bank.access.log;
    error_log  /var/log/nginx/truck-bank.error.log warn;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口代理。前端打包时的 VITE_APP_BASE_API 为 /docker-api，
    # 此处把 /docker-api/ 前缀剥掉后转发给后端（后端路由不带该前缀）。
    location /docker-api/ {
        proxy_pass http://127.0.0.1:9099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源缓存（文件名带 hash，可长缓存）
    location ~* ^/static/.*\.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
