# 大货车管理平台 —— Redis 配置（随包提供的 Redis 7.4.2）
#
# 安装位置约定：/opt/truck-bank/redis/
#   bin/redis-server     本包编译的二进制（glibc 2.28，适配麒麟 V10）
#   redis.conf           本文件
#   数据目录：/var/lib/truck-bank-redis
#
# 为什么随包提供 Redis：
#   后端使用 Redis Streams 的 XAUTOCLAIM 命令（日志聚合、GA/T1400 通知消费），
#   该命令需要 Redis >= 6.2。麒麟 V10 及 openEuler 20.03 默认源里的 redis
#   通常是 5.0.x / 6.0.x，会导致两个消费循环持续报错：
#     unknown command `XAUTOCLAIM`
#   系统其余功能仍可用，但操作日志聚合与过车记录消费不可用，故需要 6.2+。

bind 127.0.0.1
port 6379
protected-mode yes

# 由 systemd 托管，不要后台化
daemonize no
supervised no

# 日志输出到 stdout，由 journald 收集（journalctl -u truck-bank-redis）
logfile ""
loglevel notice

# 数据目录（需存在且属主为 redis 用户）
dir /var/lib/truck-bank-redis

# 持久化：AOF 保证 Streams 与令牌数据不丢；RDB 作为补充快照
appendonly yes
appendfsync everysec
appenddirname appendonlydir

save 900 1
save 300 10
save 60 10000

# 内存策略：本实例存放令牌、缓存与 Streams，不要用 allkeys-lru 以免驱逐 Streams 数据
maxmemory-policy noeviction

# 连接数
maxclients 10000
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 慢查询
slowlog-log-slower-than 10000
slowlog-max-len 128

# 安全：默认仅回环可访问。若需要密码，取消下一行注释并同步设置 .env 的 REDIS_PASSWORD
# requirepass 请改成强口令

# 关闭危险命令（可选，按需开启）
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""
# rename-command CONFIG   ""
