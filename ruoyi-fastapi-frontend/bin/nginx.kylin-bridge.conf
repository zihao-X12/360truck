# 前端 nginx 配置（bridge 网络 + 宿主机后端）
#
# 适用场景：
#   - nginx 容器使用默认 bridge 网络，通过 -p 80:80 发布端口；
#   - 后端使用 network_mode: host，在宿主机 0.0.0.0:9099 监听。
#
# 注意：
#   1. bridge 容器里的 127.0.0.1 指向容器自己，必须用 docker0 网关访问宿主机。
#      `ip -4 addr show docker0` 若不是 172.17.0.1，请同步替换下面的地址。
#   2. proxy_pass 结尾的 "/" 用于剥掉 "/docker-api" 前缀（后端路由不带该前缀）。
#   3. 前端构建产物里的 API 前缀固定为 /docker-api（见 .env.docker），不要随意改。
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /docker-api/ {
        proxy_pass http://172.17.0.1:9099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Excel 台账导入/导出和文件下载可能较慢，避免默认 60s 超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
