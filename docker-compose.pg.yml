services:
  # 前端服务
  ruoyi-frontend:
    build:
      context: ./ruoyi-fastapi-frontend
      dockerfile: Dockerfile
    image: ruoyi-frontend:latest
    container_name: ruoyi-frontend
    ports:
      - "12580:80"
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockerpg.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ruoyi-backend-pg
    networks:
      - ruoyi-network

  # 后端服务（PostgreSQL版本）
  ruoyi-backend-pg:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.pg
    image: ruoyi-backend-pg:latest
    container_name: ruoyi-backend-pg
    # 仅内网访问：后端不映射到宿主机，由前端容器经 ruoyi-network 反代。
    # 如需本机调试，临时放开下面两行并自行限制来源 IP。
    # ports:
    #   - "19099:9099"
    volumes:
      # 上传、回收站与下载目录。UploadSettings 使用相对路径且不可由环境变量覆盖，
      # 容器内固定在 /app/vf_admin 下，故整目录持久化。
      - upload-data:/app/vf_admin
    environment:
      # 生产环境务必通过 .env 或 CI 变量注入，不要沿用镜像内默认弱口令
      - DB_PASSWORD=${DB_PASSWORD:?未设置 DB_PASSWORD，请先执行 cp .env.deploy.example .env 并填写口令}
    depends_on:
      ruoyi-pg:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    networks:
      - ruoyi-network

  # PostgreSQL服务
  ruoyi-pg:
    image: postgres:14
    container_name: ruoyi-pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?未设置 POSTGRES_PASSWORD，请先执行 cp .env.deploy.example .env 并填写口令}
      POSTGRES_DB: truck_bank
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    # 仅内网访问：数据库不映射到宿主机，避免暴露公网。
    # ports:
    #   - "15432:5432"
    volumes:
      # 顺序敏感：官方镜像按文件名字母序执行本目录下全部 .sql。
      # 该目录由 scripts/prepare-docker-init.ps1 生成，依次为
      #   01-base.sql -> 02-truck-init.sql -> 03-m04.sql ... 03-m14.sql
      # 仅在 pg-data 为空（首次启动）时执行。
      - ./deploy/pg-init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  ruoyi-redis:
    image: redis:latest
    container_name: ruoyi-redis
    # 仅内网访问：Redis 不映射到宿主机。
    # ports:
    #   - "16379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  ruoyi-network:
    name: ruoyi-network
    driver: bridge

# 持久化卷。缺少这些卷时，重建容器会丢失数据库与上传文件。
volumes:
  pg-data:
    name: ruoyi-pg-data
  redis-data:
    name: ruoyi-redis-data
  upload-data:
    name: ruoyi-upload-data
